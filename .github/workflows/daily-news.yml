name: Daily AI Flash News (5本まとめ生成)

on:
  # 1日1回 05:00 JST (前日 20:00 UTC) に起動。
  # ニュース選定を 1 回だけ行い、上位 5 本を一括生成して各時間帯に予約投稿する。
  # 投稿スロット (JST): 07:00 / 12:00 / 17:00 / 19:30 / 22:00
  schedule:
    - cron: "0 20 * * *"   # 05:00 JST
  # 手動トリガー
  workflow_dispatch:
    inputs:
      mode:
        description: '実行モード: batch=5本一括生成, single=1本のみ生成'
        required: true
        default: 'batch'
        type: choice
        options:
          - batch
          - single
      theme:
        description: '(single モード時) テーマを直接指定。空欄なら news_fetcher で自動選定'
        required: false
        default: ''
      privacy:
        description: '公開設定（schedule 指定時は private 必須）'
        required: true
        default: 'private'
        type: choice
        options:
          - private
          - unlisted
          - public
      publish_at_jst:
        description: '(single モード時) 公開時刻 JST（HH:MM、空白 or "auto" で現在+30分）'
        required: false
        default: 'auto'

env:
  # batch モード時の投稿スロット (JST、HH:MM)
  PUBLISH_SLOTS: "07:00 12:00 17:00 19:30 22:00"

permissions:
  contents: write   # posted_history.json を push し直すため

# 同時実行を1本に制限（バッチ実行が長くなるため重要）
concurrency:
  group: daily-news-generation
  cancel-in-progress: false

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    # 5本生成のため余裕を持って 3 時間
    timeout-minutes: 180

    services:
      voicevox:
        image: voicevox/voicevox_engine:cpu-ubuntu22.04-latest
        ports:
          - 50021:50021

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install ffmpeg + system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-noto-cjk

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Wait for VOICEVOX engine ready
        run: |
          for i in {1..90}; do
            if curl -sf http://localhost:50021/version >/dev/null 2>&1; then
              echo "VOICEVOX ready (version: $(curl -s http://localhost:50021/version))"
              exit 0
            fi
            sleep 4
          done
          echo "VOICEVOX did not become ready in time"; exit 1

      - name: Write secrets to .env and credential files
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          cat > .env <<EOF
          ANTHROPIC_API_KEY=$ANTHROPIC_API_KEY
          REPLICATE_API_TOKEN=$REPLICATE_API_TOKEN
          PEXELS_API_KEY=$PEXELS_API_KEY
          UNSPLASH_ACCESS_KEY=$UNSPLASH_ACCESS_KEY
          EOF
          printf '%s' "$YOUTUBE_CLIENT_SECRET_JSON" > client_secret.json
          printf '%s' "$YOUTUBE_TOKEN_JSON" > token.json

      - name: Determine mode
        id: mode
        run: |
          MODE='${{ github.event.inputs.mode }}'
          # cron トリガー時は inputs が空なので batch をデフォルトに
          if [ -z "$MODE" ]; then MODE=batch; fi
          # single モードでも theme が空なら news_fetcher を呼ぶ
          echo "value=$MODE" >> "$GITHUB_OUTPUT"
          echo "選択モード: $MODE"

      # ===================================================================
      # batch モード: 5本一括生成
      # ===================================================================
      - name: "[batch] Fetch top 5 news topics"
        if: steps.mode.outputs.value == 'batch'
        run: |
          echo "📰 Claude で TOP5 ニュース選定中..."
          python news_fetcher.py --json --top 5 > topics.json
          echo "選定結果:"
          python -c "
          import json
          d = json.load(open('topics.json'))
          for i, t in enumerate(d['selected'], 1):
              print(f'  {i}. [{t.get(\"score\", \"?\")}点] {t.get(\"title\", \"\")[:50]}')
          "

      - name: "[batch] Generate 5 videos and schedule each"
        if: steps.mode.outputs.value == 'batch'
        run: |
          set -e

          # 投稿スロット (JST)
          read -ra SLOTS <<< "$PUBLISH_SLOTS"

          NUM_TOPICS=$(python -c "
          import json
          print(len(json.load(open('topics.json'))['selected']))
          ")

          if [ "$NUM_TOPICS" -lt 1 ]; then
            echo "❌ 選定されたトピックが0件。中止します。"
            exit 1
          fi

          echo "▶ ${NUM_TOPICS} 本生成 / ${#SLOTS[@]} スロット"
          SUCCESS=0
          FAILED=0

          for i in $(seq 0 $((NUM_TOPICS - 1))); do
            if [ "$i" -ge "${#SLOTS[@]}" ]; then
              echo "⚠ スロット数 (${#SLOTS[@]}) を超えるトピックは無視します"
              break
            fi

            THEME=$(python -c "
          import json
          d = json.load(open('topics.json'))
          print(d['selected'][$i]['theme_for_video'])
          ")
            TITLE=$(python -c "
          import json
          d = json.load(open('topics.json'))
          print(d['selected'][$i].get('title', ''))
          ")

            echo ""
            echo "===================================================================="
            echo "🎬 動画 $((i+1))/${NUM_TOPICS}: $TITLE"
            echo "===================================================================="

            # 失敗してもバッチ全体は継続
            if ! python main.py --genre ai_news "$THEME"; then
              echo "❌ 動画 $((i+1)) の生成に失敗。スキップします。"
              FAILED=$((FAILED + 1))
              continue
            fi

            RUN_DIR=$(ls -1tdr output/videos/*/ | tail -1)
            echo "  生成完了: $RUN_DIR"

            # 投稿時刻計算（過去なら翌日に）
            PUB_TIME="${SLOTS[$i]}"
            NOW_JST=$(TZ=Asia/Tokyo date +%s)
            TARGET_JST=$(TZ=Asia/Tokyo date -d "today $PUB_TIME" +%s)
            if [ "$TARGET_JST" -le "$NOW_JST" ]; then
              TARGET_JST=$(TZ=Asia/Tokyo date -d "tomorrow $PUB_TIME" +%s)
            fi
            ISO=$(TZ=Asia/Tokyo date -d "@$TARGET_JST" --rfc-3339=seconds | sed 's/ /T/')
            echo "  予約公開: $ISO"

            # スケジュール指定時は privacy=private 強制（YouTube仕様）
            if ! python youtube_upload.py "$RUN_DIR" \
              --privacy private \
              --schedule "$ISO"; then
              echo "❌ 動画 $((i+1)) のアップロードに失敗。"
              FAILED=$((FAILED + 1))
              continue
            fi

            SUCCESS=$((SUCCESS + 1))
            echo "✅ 動画 $((i+1)) 完了"
          done

          echo ""
          echo "===================================================================="
          echo "📊 バッチ完了: 成功 $SUCCESS / 失敗 $FAILED"
          echo "===================================================================="

          # 全失敗ならエラー扱い
          if [ "$SUCCESS" -lt 1 ]; then
            echo "❌ 1本も生成できませんでした"
            exit 1
          fi

      # ===================================================================
      # single モード: 従来の 1 本生成（手動の検証用）
      # ===================================================================
      - name: "[single] Determine theme"
        if: steps.mode.outputs.value == 'single'
        id: single_theme
        run: |
          MANUAL_THEME='${{ github.event.inputs.theme }}'
          if [ -n "$MANUAL_THEME" ]; then
            echo "Manual theme provided"
            THEME="$MANUAL_THEME"
          else
            echo "Auto-fetching top news..."
            THEME=$(python news_fetcher.py --json \
              | python -c "import json,sys; d=json.load(sys.stdin); print(d['selected'][0]['theme_for_video'])")
          fi
          echo "value<<__EOF__" >> "$GITHUB_OUTPUT"
          echo "$THEME" >> "$GITHUB_OUTPUT"
          echo "__EOF__" >> "$GITHUB_OUTPUT"

      - name: "[single] Generate video"
        if: steps.mode.outputs.value == 'single'
        run: |
          python main.py --genre ai_news "${{ steps.single_theme.outputs.value }}"

      - name: "[single] Upload to YouTube"
        if: steps.mode.outputs.value == 'single'
        run: |
          RUN_DIR=$(ls -1tdr output/videos/*/ | tail -1)
          echo "Run dir: $RUN_DIR"

          PRIVACY='${{ github.event.inputs.privacy }}'
          if [ -z "$PRIVACY" ]; then PRIVACY=private; fi

          PUB='${{ github.event.inputs.publish_at_jst }}'
          if [ -z "$PUB" ]; then PUB=auto; fi

          NOW_JST=$(TZ=Asia/Tokyo date +%s)
          if [ "$PUB" = "auto" ]; then
            TARGET_JST=$((NOW_JST + 1800))
          else
            TARGET_JST=$(TZ=Asia/Tokyo date -d "today $PUB" +%s 2>/dev/null \
                         || TZ=Asia/Tokyo date -d "$PUB" +%s)
            if [ "$TARGET_JST" -le "$NOW_JST" ]; then
              TARGET_JST=$(TZ=Asia/Tokyo date -d "tomorrow $PUB" +%s)
            fi
          fi
          ISO=$(TZ=Asia/Tokyo date -d "@$TARGET_JST" --rfc-3339=seconds | sed 's/ /T/')
          echo "予約公開: $ISO"

          python youtube_upload.py "$RUN_DIR" \
            --privacy private \
            --schedule "$ISO"

      # ===================================================================
      # 共通の後処理
      # ===================================================================
      - name: Save all outputs as artifact (debug用)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: videos-${{ github.run_id }}
          path: |
            output/videos/
            topics.json
          retention-days: 7

      - name: Commit posted_history.json back to repo
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet posted_history.json; then
            echo "No changes to history"
          else
            git add posted_history.json
            git commit -m "chore: batch update posted_history (run ${{ github.run_id }})"
            git push
          fi
